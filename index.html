<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Simon Game</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./Assets/CSS/style.css" />
    <link rel="icon" type="img/png" href="./Assets/images/gamepad.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="game-state-sec" header="Game State">
      <div class="container mt-3">
        <div class="game-state-div">
          <h1
            class="game-state d-flex justify-content-center align-items-center pt-5"
          >
            Press A Key To Start
          </h1>
        </div>
      </div>
    </section>

    <section class="game-buttons-sec" header="Game Buttons">
      <div
        class="container d-flex justify-content-center align-items-center mt-5"
      >
        <div class="game-buttons-div">
          <div lass="row d-flex justify-content-center align-items-center">
            <div
              type="button"
              id="green"
              class="btn green btn-outline-light"
            ></div>

            <div type="button" id="red" class="btn red btn-outline-light"></div>
          </div>

          <div lass="row d-flex justify-content-center align-items-center">
            <div
              type="button"
              id="yellow"
              class="btn yellow btn-outline-light"
            ></div>

            <div
              type="button"
              id="blue"
              class="btn blue btn-outline-light"
            ></div>
          </div>
        </div>
      </div>
    </section>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./Assets/JS/index.js"></script>
  </body>
</html>
